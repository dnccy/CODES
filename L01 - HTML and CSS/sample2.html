<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Internal CSS -->
    <style>
        p {
            color: green; /* All paragraphs will be green by default */
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to HTML and CSS</h1>

    <!-- Paragraph styled by internal CSS -->
    <p><b>Paragraph 1</b></p>

    <!-- Paragraph styled by internal CSS -->
    <p>Paragraph 2</p>

    <!-- Inline CSS -->
    <p style="color:red;">Paragraph 3</p>
</body>
</html>
