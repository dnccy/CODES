<div class="container mt-5">
  <h1 class="text-center">Enquire Form</h1>
  
  <!-- Centered Form -->
  <div class="row justify-content-center">
    <div class="col-md-6"> <!-- Adjust width: col-md-6 = half screen -->
      <form action="#" method="post" class="mt-4">

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <!-- Outlet -->
        <div class="mb-3">
          <label for="outlet" class="form-label">Outlet</label>
          <select id="outlet" name="outlet" class="form-select" required>
            <option value="">--Select--</option>
            <option value="north">North</option>
            <option value="east">East</option>
            <option value="south">South</option>
            <option value="west">West</option>
          </select>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" required>
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label for="date" class="form-label">Date Visited</label>
          <input type="date" id="date" name="date" class="form-control" required>
        </div>

        <!-- Enquiries -->
        <div class="mb-3">
          <label for="about" class="form-label">Enquiries</label>
          <textarea id="about" name="about" rows="4" class="form-control"></textarea>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-100">Submit</button>
      </form>

      <p class="mt-3 text-center">
        <a href="contact.html" class="btn btn-secondary">Go Back</a>
      </p>
    </div>
  </div>
</div>
